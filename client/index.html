<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Szabrownicy — Kuźnia</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0b0908;
    overflow: hidden;
    font-family: monospace;
    color: #bda997;
  }
  #game { width: 100vw; height: 100vh; }
  #game canvas { display: block; image-rendering: pixelated; }
  #boot {
    position: fixed;
    inset: 0;
    display: grid;
    place-content: center;
    text-align: center;
    letter-spacing: 2px;
    pointer-events: none;
    transition: opacity .4s;
  }

  #mixer {
    position: fixed;
    top: 10px;
    right: 10px;
    background: rgba(20, 16, 15, .82);
    border: 1px solid #453b37;
    border-radius: 4px;
    font-size: 11px;
    user-select: none;
  }
  .mixer-toggle {
    display: block;
    width: 100%;
    background: none;
    border: 0;
    border-bottom: 1px solid #2e2725;
    color: #f2700f;
    font: inherit;
    text-align: left;
    padding: 5px 8px;
    cursor: pointer;
  }
  .mixer-body { display: grid; gap: 5px; padding: 7px 8px 9px; }
  .mixer-row {
    display: grid;
    grid-template-columns: 74px 108px 34px;
    align-items: center;
    gap: 6px;
  }
  .mixer-label { color: #a08d7e; }
  .mixer-value { color: #5c4f49; text-align: right; }
  .mixer-row input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    background: #2e2725;
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .mixer-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 9px;
    height: 14px;
    background: #f2700f;
    border: 0;
    border-radius: 1px;
    cursor: pointer;
  }
  .mixer-row input[type=range]::-moz-range-thumb {
    width: 9px;
    height: 14px;
    background: #f2700f;
    border: 0;
    border-radius: 1px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div id="game"></div>
  <div id="boot">rozpalanie pieca…</div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
