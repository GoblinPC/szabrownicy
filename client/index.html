<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Szabrownicy — Kuźnia</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0b0908;
    overflow: hidden;
    font-family: monospace;
    color: #bda997;
  }
  #game { width: 100vw; height: 100vh; }
  #game canvas { display: block; image-rendering: pixelated; }
  #boot {
    position: fixed;
    inset: 0;
    display: grid;
    place-content: center;
    text-align: center;
    letter-spacing: 2px;
    pointer-events: none;
    transition: opacity .4s;
  }

  /* Ekran wejścia. Leży na grze, a nie zamiast niej — kuźnię widać już
     w trakcie logowania, przez przyciemnione tło. */
  #login {
    position: fixed;
    inset: 0;
    display: grid;
    place-content: center;
    background: rgba(11, 9, 8, .72);
    z-index: 10;
    transition: opacity .35s;
  }
  #login.login--gone { opacity: 0; pointer-events: none; }

  #login-box {
    display: grid;
    gap: 10px;
    min-width: 268px;
    padding: 22px 24px 18px;
    background: rgba(20, 16, 15, .95);
    border: 1px solid #453b37;
    border-radius: 5px;
    box-shadow: 0 0 0 1px #14100f, 0 14px 40px rgba(0, 0, 0, .6);
  }
  #login-box h1 {
    margin: 0;
    font-size: 19px;
    letter-spacing: 3px;
    color: #f2700f;
    text-align: center;
  }
  .login-sub {
    margin: -8px 0 6px;
    text-align: center;
    font-size: 11px;
    letter-spacing: 4px;
    color: #6b5d54;
  }
  #login-box label {
    display: grid;
    gap: 3px;
    font-size: 11px;
    color: #a08d7e;
  }
  #login-box input {
    background: #14100f;
    border: 1px solid #453b37;
    border-radius: 3px;
    color: #e8dcc0;
    font: inherit;
    font-size: 13px;
    padding: 7px 8px;
  }
  #login-box input:focus { outline: none; border-color: #f2700f; }
  #login-box button {
    margin-top: 4px;
    background: #5a3f2b;
    border: 1px solid #7a5738;
    border-radius: 3px;
    color: #ffe08a;
    font: inherit;
    font-size: 12px;
    letter-spacing: 1px;
    padding: 8px;
    cursor: pointer;
  }
  #login-box button:hover:not(:disabled) { background: #7a5738; }
  #login-box button:disabled { opacity: .55; cursor: default; }
  .login-msg { margin: 0; min-height: 14px; font-size: 11px; color: #6b9c45; text-align: center; }
  .login-msg--bad { color: #c43a0d; }
  .login-hint { margin: 0; font-size: 10px; color: #5c4f49; text-align: center; line-height: 1.4; }

  #mixer {
    position: fixed;
    top: 10px;
    right: 10px;
    background: rgba(20, 16, 15, .82);
    border: 1px solid #453b37;
    border-radius: 4px;
    font-size: 11px;
    user-select: none;
  }
  .mixer-toggle {
    display: block;
    width: 100%;
    background: none;
    border: 0;
    border-bottom: 1px solid #2e2725;
    color: #f2700f;
    font: inherit;
    text-align: left;
    padding: 5px 8px;
    cursor: pointer;
  }
  .mixer-body { display: grid; gap: 5px; padding: 7px 8px 9px; }
  .mixer-row {
    display: grid;
    grid-template-columns: 74px 108px 34px;
    align-items: center;
    gap: 6px;
  }
  .mixer-label { color: #a08d7e; }
  .mixer-value { color: #5c4f49; text-align: right; }
  .mixer-row input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    background: #2e2725;
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .mixer-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 9px;
    height: 14px;
    background: #f2700f;
    border: 0;
    border-radius: 1px;
    cursor: pointer;
  }
  .mixer-row input[type=range]::-moz-range-thumb {
    width: 9px;
    height: 14px;
    background: #f2700f;
    border: 0;
    border-radius: 1px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div id="game"></div>
  <div id="boot">rozpalanie pieca…</div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
