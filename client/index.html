<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Szabrownicy — Kuźnia</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0b0908;
    overflow: hidden;
    font-family: monospace;
    color: #bda997;
  }
  #game { width: 100vw; height: 100vh; }
  #game canvas { display: block; image-rendering: pixelated; }
  #boot {
    position: fixed;
    inset: 0;
    display: grid;
    place-content: center;
    text-align: center;
    letter-spacing: 2px;
    pointer-events: none;
    transition: opacity .4s;
  }

  /* Ekran wejścia. Leży na grze, a nie zamiast niej — kuźnię widać już
     w trakcie logowania, przez przyciemnione tło. */
  #login {
    position: fixed;
    inset: 0;
    display: grid;
    place-content: center;
    background: rgba(11, 9, 8, .72);
    z-index: 10;
    transition: opacity .35s;
  }
  #login.login--gone { opacity: 0; pointer-events: none; }

  #login-box {
    display: grid;
    gap: 10px;
    min-width: 268px;
    padding: 22px 24px 18px;
    background: rgba(20, 16, 15, .95);
    border: 1px solid #453b37;
    border-radius: 5px;
    box-shadow: 0 0 0 1px #14100f, 0 14px 40px rgba(0, 0, 0, .6);
  }
  #login-box h1 {
    margin: 0;
    font-size: 19px;
    letter-spacing: 3px;
    color: #f2700f;
    text-align: center;
  }
  .login-sub {
    margin: -8px 0 6px;
    text-align: center;
    font-size: 11px;
    letter-spacing: 4px;
    color: #6b5d54;
  }
  #login-box label {
    display: grid;
    gap: 3px;
    font-size: 11px;
    color: #a08d7e;
  }
  #login-box input {
    background: #14100f;
    border: 1px solid #453b37;
    border-radius: 3px;
    color: #e8dcc0;
    font: inherit;
    font-size: 13px;
    padding: 7px 8px;
  }
  #login-box input:focus { outline: none; border-color: #f2700f; }
  #login-box button {
    margin-top: 4px;
    background: #5a3f2b;
    border: 1px solid #7a5738;
    border-radius: 3px;
    color: #ffe08a;
    font: inherit;
    font-size: 12px;
    letter-spacing: 1px;
    padding: 8px;
    cursor: pointer;
  }
  #login-box button:hover:not(:disabled) { background: #7a5738; }
  #login-box button:disabled { opacity: .55; cursor: default; }
  .login-msg { margin: 0; min-height: 14px; font-size: 11px; color: #6b9c45; text-align: center; }
  .login-msg--bad { color: #c43a0d; }
  .login-hint { margin: 0; font-size: 10px; color: #5c4f49; text-align: center; line-height: 1.4; }

  /* Czat: linijka, w której gracz właśnie pisze. Siedzi nad paskiem podpowiedzi
     w lewym dolnym rogu, a log wiadomości Phaser rysuje nad nią. */
  #chat-input {
    position: fixed;
    left: 10px;
    bottom: 72px;
    z-index: 9;
  }
  #chat-input form {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 7px;
    background: rgba(20, 16, 15, .9);
    border: 1px solid #f2700f;
    border-radius: 3px;
  }
  .chat-prompt { color: #f2700f; font-size: 12px; }
  #chat-input input {
    width: min(46vw, 320px);
    background: none;
    border: 0;
    outline: none;
    color: #e8dcc0;
    font: inherit;
    font-size: 12px;
  }
  .chat-left { min-width: 18px; text-align: right; font-size: 10px; color: #6b5d54; }

  /* Pasek narzędzi. Widoczny **zawsze**, także przy zamkniętym plecaku: to
     jedyne miejsce, które odpowiada na pytanie „co mam w ręce", a odpowiadać
     na nie trzeba w biegu. Nad plecakiem (z-index), żeby dało się przeciągnąć
     na niego rzecz z otwartej siatki. */
  #hotbar {
    position: fixed;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    z-index: 12;
  }
  .hot-cell {
    position: relative;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    background: rgba(20, 16, 15, .92);
    border: 1px solid #453b37;
    border-radius: 3px;
    box-shadow: 0 0 0 1px #14100f;
    cursor: pointer;
  }
  /* Wybrane gniazdo świeci **obwódką, nie tłem**: tło zmieniałoby czytelność
     samej ikony, a chodzi o to, żeby od razu widzieć, które jest w ręce. */
  .hot-cell--on { border-color: #f2700f; box-shadow: 0 0 0 1px #14100f, 0 0 0 2px rgba(242, 112, 15, .35); }
  .hot-cell:hover { border-color: #7a5738; }
  .hot-num {
    position: absolute;
    top: 1px;
    left: 3px;
    font-size: 9px;
    color: #5c4f49;
  }
  .hot-icon { image-rendering: pixelated; }

  /* Plecak-siatka. Leży na grze, a nie zamiast niej — świat widać dalej przez
     przyciemnione tło, bo otwarcie plecaka nie zatrzymuje gry i nie zatrzyma:
     przekładanie łupu stojąc nad trupem w otwartym świecie ma być ryzykiem. */
  #backpack {
    position: fixed;
    inset: 0;
    display: grid;
    place-content: center;
    background: rgba(11, 9, 8, .55);
    z-index: 11;
  }
  #bag-wrap { display: flex; gap: 12px; align-items: flex-start; }
  #bag-panel, #craft-panel, #bag-sack {
    padding: 14px 16px 10px;
    background: rgba(20, 16, 15, .96);
    border: 1px solid #453b37;
    border-radius: 5px;
    box-shadow: 0 0 0 1px #14100f, 0 14px 40px rgba(0, 0, 0, .6);
  }

  /* Okno warsztatu. Osobne od plecaka i otwierane przy stole — lista wyrobów
     wisiała wcześniej z boku plecaka i była tam zawsze, choć przydawała się
     w jednym miejscu na mapie. */
  #craft {
    position: fixed;
    inset: 0;
    display: grid;
    place-content: center;
    background: rgba(11, 9, 8, .55);
    z-index: 11;
  }
  #craft-panel { min-width: 260px; }
  #craft-list { display: grid; gap: 6px; }
  .craft-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 9px;
    border: 1px solid #453b37;
    border-radius: 3px;
    background: rgba(69, 59, 55, .35);
    cursor: pointer;
  }
  .craft-row:hover { border-color: #f2700f; }
  /* Brak składników przygasza wiersz, ale go nie chowa: gracz ma wiedzieć,
     co się tu da zrobić i czego mu do tego brakuje. */
  .craft-row--no { opacity: .5; cursor: default; }
  .craft-row--no:hover { border-color: #453b37; }
  /* Pole ikony ma **stały rozmiar**, więc kilof, siekiera i dzida stoją w jednej
     kolumnie mimo różnych wysokości rysunków. */
  .craft-slot {
    flex: none;
    width: 40px;
    height: 56px;
    display: grid;
    place-items: center;
  }
  .craft-icon { image-rendering: pixelated; }
  .craft-text { display: grid; gap: 3px; font-size: 12px; }
  .craft-text b { color: #e8dcc0; font-weight: normal; letter-spacing: 1px; }
  .craft-cost { font-size: 10px; color: #a08d7e; }
  .craft-lack { color: #a04a4a; }
  #craft-title {
    font-size: 12px;
    letter-spacing: 4px;
    color: #f2700f;
    margin-bottom: 10px;
  }
  #craft-hint {
    margin-top: 9px;
    font-size: 10px;
    letter-spacing: 1px;
    color: #6b5d54;
  }
  #craft-hint b { color: #a08d7e; font-weight: normal; }
  /* Worek po zabitym. Kupa rzeczy, nie druga siatka — kratki układają się same,
     bo w worku nie ma kształtów ani obracania. */
  #bag-sack { min-width: 180px; max-width: 260px; }
  #sack-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    align-content: flex-start;
  }
  .sack-cell {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    background-color: #14100f;
    border: 1px solid #453b37;
    border-radius: 3px;
    cursor: pointer;
  }
  .sack-cell:hover { border-color: #f2700f; }
  .sack-icon { image-rendering: pixelated; }

  #bag-title {
    font-size: 12px;
    letter-spacing: 4px;
    color: #f2700f;
    margin-bottom: 10px;
  }
  #bag-hint {
    margin-top: 9px;
    font-size: 10px;
    letter-spacing: 1px;
    color: #6b5d54;
  }
  #bag-hint b { color: #a08d7e; font-weight: normal; }

  /* Gniazdo noszonej rzeczy — obok siatki, nie w niej: założone wychodzi
     z plecaka i nie zajmuje kratek. */
  #bag-body { display: flex; gap: 10px; align-items: flex-start; }
  #bag-gear { display: grid; gap: 6px; }
  .gear-slot {
    position: relative;
    width: 96px;
    height: 144px;
    display: grid;
    place-items: center;
    background-color: #14100f;
    border: 1px solid #453b37;
    border-radius: 3px;
    cursor: pointer;
  }
  .gear-slot:hover { border-color: #7a5738; }
  .gear-slot--on { border-color: #5a3f2b; }
  .gear-label {
    font-size: 10px;
    letter-spacing: 2px;
    color: #453b37;
  }
  .gear-icon { image-rendering: pixelated; }

  /* Kratki rysowane gradientem, nie osobnymi elementami: przy plecaku 8x5 to
     czterdzieści węzłów mniej w drzewie, a wygląda tak samo. */
  #bag-grid {
    position: relative;
    background-color: #14100f;
    background-image:
      linear-gradient(to right, #2e2725 1px, transparent 1px),
      linear-gradient(to bottom, #2e2725 1px, transparent 1px);
    border: 1px solid #453b37;
  }
  .bag-item {
    position: absolute;
    box-sizing: border-box;
    border: 1px solid #5c4f49;
    background: rgba(69, 59, 55, .5);
    cursor: grab;
  }
  .bag-item--drag {
    cursor: grabbing;
    z-index: 2;
    opacity: .85;
    border-color: #f2700f;
    /* **Przeciągany przedmiot jest przezroczysty dla trafień.**
       Jedzie pod kursorem, więc bez tego pytanie „co leży pod kursorem"
       odpowiadało zawsze „ten przedmiot" — i puszczenie go na gniazdo zbroi
       albo na pasek narzędzi nie robiło nic. Zgłoszone jako „nie mogę założyć
       zbroi". */
    pointer-events: none;
  }
  /* Czerwona ramka zamiast blokady: gracz ma widzieć, że tu się nie zmieści,
     a nie odbijać się od niewidzialnej ściany. */
  .bag-item--bad { border-color: #8e2233; background: rgba(142, 34, 51, .3); }
  .bag-icon {
    pointer-events: none;
    image-rendering: pixelated;
  }

  /* Menu pod ESC. Tu mieszkają suwaki głośności — z rogu ekranu zeszły, bo
     ustawia się je raz na sesję, a zajmowały widok przez całą grę. */
  #menu {
    position: fixed;
    inset: 0;
    display: grid;
    place-content: center;
    background: rgba(11, 9, 8, .62);
    z-index: 13;
    font-size: 11px;
  }
  #menu-panel {
    min-width: 300px;
    padding: 18px 20px 16px;
    background: rgba(20, 16, 15, .96);
    border: 1px solid #453b37;
    border-radius: 5px;
    box-shadow: 0 0 0 1px #14100f, 0 14px 40px rgba(0, 0, 0, .6);
  }
  #menu-title {
    font-size: 13px;
    letter-spacing: 5px;
    color: #f2700f;
    margin-bottom: 14px;
    text-align: center;
  }
  .menu-section {
    font-size: 10px;
    letter-spacing: 3px;
    color: #6b5d54;
    margin: 4px 0 6px;
  }
  .menu-keys {
    margin: 14px 0 12px;
    font-size: 10px;
    line-height: 1.7;
    color: #6b5d54;
  }
  .menu-keys b { color: #a08d7e; font-weight: normal; }
  .menu-button {
    display: block;
    width: 100%;
    margin-top: 6px;
    padding: 7px;
    background: #5a3f2b;
    border: 1px solid #7a5738;
    border-radius: 3px;
    color: #ffe08a;
    font: inherit;
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
  }
  .menu-button:hover { background: #7a5738; }

  .mixer-body { display: grid; gap: 5px; }
  .mixer-row {
    display: grid;
    grid-template-columns: 74px 108px 34px;
    align-items: center;
    gap: 6px;
  }
  .mixer-label { color: #a08d7e; }
  .mixer-value { color: #5c4f49; text-align: right; }
  .mixer-row input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    background: #2e2725;
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .mixer-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 9px;
    height: 14px;
    background: #f2700f;
    border: 0;
    border-radius: 1px;
    cursor: pointer;
  }
  .mixer-row input[type=range]::-moz-range-thumb {
    width: 9px;
    height: 14px;
    background: #f2700f;
    border: 0;
    border-radius: 1px;
    cursor: pointer;
  }

  /* Panel testowy: pora dnia i pogoda. Przyrząd, nie interfejs gracza — chodzi
     pod F1 razem z panelem diagnostycznym. Siedzi pod mikserem, żeby nie
     zasłaniać rogu z nickami. */
  #testpanel {
    position: fixed;
    top: 152px;
    right: 10px;
    width: 226px;
    padding: 6px 8px 8px;
    background: rgba(20, 16, 15, .82);
    border: 1px solid #453b37;
    border-radius: 4px;
    font-size: 11px;
    user-select: none;
  }
  .test-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #f2700f;
    border-bottom: 1px solid #2e2725;
    padding-bottom: 4px;
    margin-bottom: 6px;
  }
  .test-auto {
    background: none;
    border: 1px solid #453b37;
    border-radius: 3px;
    color: #6b5d54;
    font: inherit;
    font-size: 10px;
    padding: 1px 6px;
    cursor: pointer;
  }
  .test-auto:hover { border-color: #6b9c45; color: #6b9c45; }
  .test-row + .test-row { margin-top: 7px; }
  .test-head { color: #a08d7e; margin-bottom: 2px; }
  #testpanel .mixer-row { grid-template-columns: 1fr 38px; }
  .test-caption { margin-top: 3px; color: #5c4f49; font-size: 10px; }
  .test-caption--manual { color: #f2700f; }
</style>
</head>
<body>
  <div id="game"></div>
  <div id="boot">rozpalanie pieca…</div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
